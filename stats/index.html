<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>游戏数据统计 · 每日挑战 / 闯关 / 道具</title>
<style>
  :root {
    --bg: #f3efe6; --card: #fffdf8; --ink: #2a2520; --soft: #6b6256;
    --line: #d8cdb4; --accent: #b03328; --ok: #237a36;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse at top, #fbf7ec 0%, var(--bg) 55%);
    padding: 28px 16px 48px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 24px; }
  h2 { margin: 0 0 12px; font-size: 16px; }
  .sub { color: var(--soft); font-size: 13px; margin-bottom: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 14px; box-shadow: 0 8px 28px rgba(80,60,30,.06);
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--soft); }
  input {
    min-width: 150px; padding: 9px 11px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 14px; background: #fff;
  }
  button {
    border: 0; border-radius: 8px; padding: 10px 16px;
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: #5c4a3a; }
  button:disabled { opacity: .55; }
  .metrics { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
  @media (max-width: 720px) { .metrics { grid-template-columns: 1fr 1fr; } }
  .metric {
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 12px;
    background: linear-gradient(180deg, #fffefb, #f7f1e4);
  }
  .metric .k { font-size: 12px; color: var(--soft); margin-bottom: 6px; }
  .metric .v { font-size: 28px; font-weight: 700; }
  .metric .u { font-size: 11px; color: var(--soft); margin-top: 4px; }
  .status { font-size: 13px; color: var(--soft); margin-top: 10px; min-height: 1.2em; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--soft); font-weight: 600; }
  .hint { font-size: 12px; color: var(--soft); line-height: 1.5; margin-top: 10px; }
  code { background: #f0e8d8; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>游戏数据统计</h1>
    <div class="sub">每日挑战 + 闯关 + 道具（按关）。不含对弈。正在玩 = 近 3 分钟活跃且未通关。</div>

    <div class="card">
      <div class="row">
        <label>口令<input id="pass" type="password" placeholder="工作台口令" autocomplete="current-password" /></label>
        <label>日期（北京时间）<input id="date" type="date" /></label>
        <button id="btnLoad" type="button">刷新</button>
        <button id="btnAuto" class="secondary" type="button">自动刷新：关</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <h2>每日挑战</h2>
      <div class="metrics" id="dailyMetrics"></div>
    </div>

    <div class="card">
      <h2>闯关</h2>
      <div class="metrics" id="campaignMetrics"></div>
    </div>

    <div class="card">
      <h2>道具使用（合计）</h2>
      <div class="metrics" id="toolTotals"></div>
      <h2 style="margin-top:18px">道具使用（分关）</h2>
      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>关卡</th><th>撤销</th><th>提示</th><th>洗牌</th><th>磁铁</th><th>合计</th>
            </tr>
          </thead>
          <tbody id="toolByLevel"></tbody>
        </table>
      </div>
      <p class="hint">页面 <code>/stats/</code> · 接口 <code>/api/daily-stats/summary</code></p>
    </div>
  </div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const PASS_KEY = 'dailyStatsPass';
  const API = '/api/daily-stats/summary';
  let autoTimer = null;

  function todayBeijing() {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
  }

  function setStatus(text, cls) {
    const el = $('status');
    el.textContent = text || '';
    el.className = 'status' + (cls ? ' ' + cls : '');
  }

  function metricHtml(items) {
    return items.map(([k, v, u]) =>
      `<div class="metric"><div class="k">${k}</div><div class="v">${v}</div><div class="u">${u}</div></div>`
    ).join('');
  }

  function fillMode(elId, block) {
    const b = block || {};
    $(elId).innerHTML = metricHtml([
      ['玩过（人）', b.played != null ? b.played : '—', '至少开过一局'],
      ['正在玩（人）', b.playingNow != null ? b.playingNow : '—', '近 3 分钟活跃'],
      ['已通过（人）', b.passed != null ? b.passed : '—', '当日通关人数'],
      ['通过率', b.passRate != null ? (b.passRate + '%') : '—', '通过 ÷ 玩过'],
    ]);
  }

  function fillTools(data) {
    const t = (data && data.tools && data.tools.totals) || {};
    $('toolTotals').innerHTML = metricHtml([
      ['撤销', t.undo != null ? t.undo : '—', 'undo'],
      ['提示', t.hint != null ? t.hint : '—', 'hint'],
      ['洗牌', t.shuffle != null ? t.shuffle : '—', 'shuffle'],
      ['磁铁', t.magnet != null ? t.magnet : '—', 'magnet'],
    ]);
    const rows = (data && data.tools && data.tools.byLevel) || [];
    const tb = $('toolByLevel');
    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#6b6256">暂无分关数据</td></tr>';
      return;
    }
    tb.innerHTML = rows.map((r) =>
      `<tr><td>第 ${r.levelId} 关</td><td>${r.undo||0}</td><td>${r.hint||0}</td><td>${r.shuffle||0}</td><td>${r.magnet||0}</td><td>${r.total||0}</td></tr>`
    ).join('');
  }

  async function load() {
    const pass = $('pass').value.trim();
    const date = $('date').value;
    if (!pass) { setStatus('请先填口令', 'err'); return; }
    localStorage.setItem(PASS_KEY, pass);
    $('btnLoad').disabled = true;
    setStatus('加载中…');
    try {
      const qs = new URLSearchParams();
      if (date) qs.set('date', date);
      qs.set('pass', pass);
      const r = await fetch(API + '?' + qs.toString(), {
        headers: { 'X-Workbench-Pass': pass, 'X-Daily-Stats-Pass': pass },
        cache: 'no-store',
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) {
        fillMode('dailyMetrics', {});
        fillMode('campaignMetrics', {});
        fillTools({});
        setStatus((j && j.error) || ('HTTP ' + r.status), 'err');
        return;
      }
      fillMode('dailyMetrics', j.daily || j);
      fillMode('campaignMetrics', j.campaign || {});
      fillTools(j);
      setStatus('日期 ' + j.date + ' · 更新 ' + String(j.updatedAt || '').replace('T', ' ').replace(/\.\d+Z$/, ' UTC'), 'ok');
    } catch (e) {
      setStatus('请求失败：' + (e && e.message ? e.message : e), 'err');
    } finally {
      $('btnLoad').disabled = false;
    }
  }

  function toggleAuto() {
    if (autoTimer) {
      clearInterval(autoTimer); autoTimer = null;
      $('btnAuto').textContent = '自动刷新：关';
      return;
    }
    $('btnAuto').textContent = '自动刷新：开（15s）';
    void load();
    autoTimer = setInterval(() => { void load(); }, 15000);
  }

  fillMode('dailyMetrics', {});
  fillMode('campaignMetrics', {});
  fillTools({});
  $('pass').value = localStorage.getItem(PASS_KEY) || '';
  $('date').value = todayBeijing();
  $('btnLoad').addEventListener('click', () => { void load(); });
  $('btnAuto').addEventListener('click', toggleAuto);
  $('pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') void load(); });
})();
</script>
</body>
</html>
